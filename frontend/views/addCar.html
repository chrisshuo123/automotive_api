<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <meta name="twitter:widgets:autoload" content="off">
    <link rel="stylesheet" href="../public/css/style_panelCar.css">
    <title>Add Car</title>
</head>
<body>
    <div class="container">
        <h1>Add new car</h1>
        <form id="carForm">
            <div class="form-group">
                <label for="nama_mobil">Car Name: </label>
                <input type="text" id="nama_mobil" name="nama_mobil" required>
            </div>

            <div class="form-group">
                <label for="merek">Brand: </label>
                <select id="merek" name="merek" required>
                    <option value="">Select a brand</option>
                    <option value="1">Toyota</option>
                    <!-- Options will be populated by JavaScript -->
                </select>
            </div>

            <div class="form-group">
                <label for="jenis">Type: </label>
                <select id="jenis" name="jenis" required>
                    <option value="">Select a type</option>
                    <!-- Options will be populated by Javascript -->
                </select>
            </div>

            <div class="form-group">
                <label for="horse_power">Horse Power: </label>
                <input type="number" id="horse_power" name="horse_power" required>
            </div>

            <div class="form-group">
                <label for="image">Image: </label>
                <input type="file" id="image_car" name="image" accept="image/*" required>
            </div>

            <!-- <div class="form-group">
                <label for="status">Status: </label>
                <select id="status" name="status" required>
                    <option value="">Select a status</option>
                    <!-- Options will be populated by Javascript -->
                <!-- </select>
            </div> -->

            <button type="submit">Submit</button>
        </form>
        <button type="button" class="second-button" style="margin-top: 10px;">Add Brand</button>
        <button type="button" class="second-button">Add Type</button>

        <div id="message" class="message"></div>

        <h2>Car List</h2>
        <!-- Search and Filter Section -->
        <div class="search-filter-container">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search by car title...">
                <button onclick="searchCars()">Search</button>
            </div>

            <div class="filter-box" style="margin-bottom: 75px;">
                <label for="statusFilter">Status:</label>
                <!-- <select id="statusFilter" onchange="filterCars()"> -->
                <select id="statusFilter">
                    <option value="">All Status</option> <!-- '' and 'all' are treated as "show all" -->
                    <option value="Approved">Approved</option>
                    <option value="Need preview">Need Preview</option>
                </select>
            </div>

            <div>
                <button id="clearBtn" title="Clear All Filters" class="clearBtn">
                X
                </button>
            </div>
        </div>

        <div id="carList"></div>
        <!-- <div id="noResults" style="display:none;">
            <div>No Results Found</div>
        </div> -->
    </div>

    <div id="editModal" class="modal" style="display:none;">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2>Edit Car</h2>
            <form id="editCarForm">
                <input type="hidden" id="edit_id">

                <label>Car Name:</label>
                <input type="text" id="edit_nama_mobil" required>

                <label>Brand:</label>
                <select id="edit_merek" name="merek" required>
                    <option value="">Select a brand</option>
                    <!-- Populated by fetchBrands() -->
                </select>

                <!--<select id="merek" name="merek" required>
                    <option value="">Select a brand</option>
                    <option value="1">Toyota</option>
                    <!-- Options will be populated by JavaScript -->
                <!--</select>-->

                <label>Type:</label>
                <select id="edit_jenis" name="jenis" required>
                    <option value="">Select a Type</option>
                    <!-- Populated by fetchTypes() -->
                </select>

                <label>Horse Power:</label>
                <input type="number" id="edit_horse_power" required>

                <label>Status:</label>
                <select id="edit_status" name="status" required>
                    <option value="">Select a Status</option>
                    <!-- Populated by fetchStatus() -->
                </select>

                <label>Image:</label>
                <input type="file" id="edit_image_car" name="image" accept="image/*">
                <!-- accept="../public/img/*" -->

                <button type="submit">Update</button>
            </form>
        </div>
    </div>
